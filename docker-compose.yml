version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pragma-postgres
    environment:
      POSTGRES_USER: pragma
      POSTGRES_PASSWORD: pragma_dev
      POSTGRES_DB: pragma_db
    ports:
      - "5432:5432"
    volumes:
      - pragma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pragma -d pragma_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pragma-net

  redis:
    image: redis:7-alpine
    container_name: pragma-redis
    ports:
      - "6379:6379"
    volumes:
      - pragma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - pragma-net

  neo4j:
    image: neo4j:5-community
    container_name: pragma-neo4j
    environment:
      NEO4J_AUTH: neo4j/pragma_dev_password
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - pragma_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - pragma-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pragma-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://pragma:pragma_dev@postgres:5432/pragma_db
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pragma_dev_password
      JWT_SECRET: pragma_docker_dev_secret_change_in_prod
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - pragma-net
    restart: unless-stopped

volumes:
  pragma_postgres_data:
  pragma_redis_data:
  pragma_neo4j_data:

networks:
  pragma-net:
    driver: bridge
